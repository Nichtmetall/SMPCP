<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

<div class="container-fluid py-4">
  <div class="d-flex align-items-center gap-3 mb-3">
    <h5 class="mb-0" style="font-weight:500;color:var(--color-text-primary)">SAP Passwort-Parser</h5>
    <span id="badge" class="badge bg-secondary">0 Einträge</span>
  </div>

  <div class="mb-3">
    <textarea id="input" class="form-control" rows="6" placeholder="SAP-Output hier einfügen …" style="font-family:var(--font-mono);font-size:13px;resize:vertical;background:var(--color-background-secondary);color:var(--color-text-primary);border:0.5px solid var(--color-border-secondary)"></textarea>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-4">
    <button class="btn btn-primary btn-sm" onclick="parse()">Parsen</button>
    <button class="btn btn-outline-secondary btn-sm" onclick="clearAll()">Zurücksetzen</button>
    <div class="ms-auto d-flex gap-2" id="copyBtns" style="display:none!important">
      <div class="dropdown">
        <button class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown">
          Alle kopieren
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" onclick="copyAll('tsv');return false">Als TSV (Tab-getrennt)</a></li>
          <li><a class="dropdown-item" href="#" onclick="copyAll('html');return false">Als HTML-Tabelle</a></li>
        </ul>
      </div>
    </div>
  </div>

  <div id="tableWrap" style="display:none">
    <table class="table table-bordered table-hover align-middle mb-0" style="font-size:14px">
      <thead class="table-light">
        <tr>
          <th style="width:40px">#</th>
          <th>Benutzername</th>
          <th>Passwort</th>
          <th style="width:160px;text-align:center">Aktionen</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="toast" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:none">
    <div class="toast show align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastMsg">Kopiert!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="document.getElementById('toast').style.display='none'"></button>
      </div>
    </div>
  </div>
</div>

<script>
const DEFAULT = ``;

document.getElementById('input').value = DEFAULT;
let entries = [];

function parse() {
  const text = document.getElementById('input').value;
  const regex = /Generiertes Kennwort f[üu]r Benutzer (\S+)\s*:\s*(\S+)/g;
  entries = [];
  let m;
  while ((m = regex.exec(text)) !== null) {
    entries.push({ user: m[1], pw: m[2] });
  }
  render();
}

// Generiert Betreff und Text für die E-Mail
function getMailContent(user, pw) {
  const subject = `Ihr neues SAP-Passwort`;
  const body = `Guten Tag,

für Ihren SAP-Benutzer wurde ein neues Passwort generiert.

Passwort: ${pw}

Bitte denken Sie daran, das Passwort bei der ersten Anmeldung umgehend zu ändern.

Viele Grüße`;
  return { subject, body };
}

function render() {
  const tbody = document.getElementById('tbody');
  const wrap = document.getElementById('tableWrap');
  const badge = document.getElementById('badge');
  const copyBtns = document.getElementById('copyBtns');

  if (entries.length === 0) {
    wrap.style.display = 'none';
    copyBtns.style.display = 'none';
    badge.textContent = '0 Einträge';
    badge.className = 'badge bg-secondary';
    return;
  }

  badge.textContent = entries.length + ' Einträge';
  badge.className = 'badge bg-success';
  copyBtns.style.removeProperty('display');
  wrap.style.display = '';

  tbody.innerHTML = entries.map((e, i) => {
    const mail = getMailContent(e.user, e.pw);
    const mailtoLink = `mailto:?subject=${encodeURIComponent(mail.subject)}&body=${encodeURIComponent(mail.body)}`;
    
    return `
    <tr>
      <td class="text-muted" style="font-size:12px">${i+1}</td>
      <td><code style="font-size:13px;color:var(--color-text-primary);background:none;padding:0">${esc(e.user)}</code></td>
      <td><code style="font-size:13px;color:var(--color-text-primary);background:none;padding:0;word-break:break-all">${esc(e.pw)}</code></td>
      <td style="text-align:center">
        <div class="d-flex gap-1 justify-content-center">
          <a class="btn btn-outline-primary btn-sm" style="font-size:11px;padding:2px 8px" href="${mailtoLink}" title="Im E-Mail-Programm öffnen">✉️ Mail</a>
          <div class="dropdown">
            <button class="btn btn-outline-secondary btn-sm dropdown-toggle" style="font-size:11px;padding:2px 8px" data-bs-toggle="dropdown">Kopie</button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="#" onclick="copyRow(${i},'tsv');return false">Als Text (TSV)</a></li>
              <li><a class="dropdown-item" href="#" onclick="copyRow(${i},'html');return false">Als HTML-Zeile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" onclick="copyMail(${i});return false">Mail-Text kopieren</a></li>
            </ul>
          </div>
        </div>
      </td>
    </tr>
  `}).join('');
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildHtml(rows) {
  const thead = `<thead><tr><th>Benutzername</th><th>Passwort</th></tr></thead>`;
  const tbody = `<tbody>${rows.map(e=>`<tr><td>${esc(e.user)}</td><td>${esc(e.pw)}</td></tr>`).join('')}</tbody>`;
  return `<table border="1" cellpadding="4" cellspacing="0">${thead}${tbody}</table>`;
}

function copyToClipboard(text, html, label) {
  if (navigator.clipboard && window.ClipboardItem) {
    const items = {};
    if (html) items['text/html'] = new Blob([html], {type:'text/html'});
    items['text/plain'] = new Blob([text], {type:'text/plain'});
    navigator.clipboard.write([new ClipboardItem(items)]).then(() => showToast(label));
  } else {
    navigator.clipboard.writeText(text).then(() => showToast(label + ' (nur Text)'));
  }
}

function copyRow(i, mode) {
  const e = entries[i];
  if (mode === 'html') {
    copyToClipboard(e.user + '\t' + e.pw, buildHtml([e]), 'HTML-Zeile kopiert: ' + e.user);
  } else {
    copyToClipboard(e.user + '\t' + e.pw, null, 'Kopiert: ' + e.user);
  }
}

function copyMail(i) {
  const e = entries[i];
  const mail = getMailContent(e.user, e.pw);
  const textToCopy = `Betreff: ${mail.subject}\n\n${mail.body}`;
  copyToClipboard(textToCopy, null, 'Mail-Text kopiert: ' + e.user);
}

function copyAll(mode) {
  if (mode === 'html') {
    const html = buildHtml(entries);
    const tsv = entries.map(e => e.user + '\t' + e.pw).join('\n');
    copyToClipboard(tsv, html, 'HTML-Tabelle kopiert (' + entries.length + ' Einträge)');
  } else {
    const tsv = entries.map(e => e.user + '\t' + e.pw).join('\n');
    copyToClipboard(tsv, null, 'TSV kopiert (' + entries.length + ' Einträge)');
  }
}

function clearAll() {
  document.getElementById('input').value = '';
  entries = [];
  render();
}

function showToast(msg) {
  document.getElementById('toastMsg').textContent = msg;
  const t = document.getElementById('toast');
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

parse();
</script>
